<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz JavaScript : Questions</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">&lt;/&gt;</div>
            <h1>Quiz JavaScript</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Accueil</a></li>
                <li><a class="active" href="quiz.html">Quiz</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <div class="quiz-header">
                <p id="compteur">Question 1 sur 5</p>
                <span class="badge-tag">DOM &amp; Événements</span>
            </div>
            <progress id="progression" aria-label="Progression du quiz" value="0" max="5"></progress>

            <h2 id="question">Chargement de la question...</h2>

            <div class="reponses">
                <button class="reponse" type="button"></button>
                <button class="reponse" type="button"></button>
                <button class="reponse" type="button"></button>
                <button class="reponse" type="button"></button>
            </div>

            <!-- Explication affichée par quiz.js -->
            <p id="message" aria-live="polite"></p>

            <!-- Bouton géré par quiz.js -->
            <div class="quiz-actions">
                <button id="suivant" class="btn" type="button" hidden>Question suivante &rarr;</button>
            </div>
        </section>
    </main>

    <footer>
        <p>ISSAT Sousse — Chehata Rayen — Mini Projet JavaScript</p>
    </footer>

    <script src="quiz.js"></script>
</body>
</html>
